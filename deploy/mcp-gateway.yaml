# Apply after upgrading the control plane (it initializes the gateway tables).
apiVersion: v1
kind: ConfigMap
metadata:
  name: guanyin-mcp-gateway
  namespace: guanyin-enterprise-system
data:
  # Proxy origins are managed per space in the control plane, not in environment variables.
  PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guanyin-mcp-gateway
  namespace: guanyin-enterprise-system
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: guanyin-mcp-gateway }
  template:
    metadata:
      labels: { app: guanyin-mcp-gateway }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: guanyin/mcp-gateway:0.1.2
          ports:
            - { name: mcp, containerPort: 8080 }
            - { name: proxy, containerPort: 8081 }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: guanyin-database, key: url } }
          envFrom:
            - configMapRef: { name: guanyin-mcp-gateway }
          readinessProbe:
            httpGet: { path: /readyz, port: mcp }
          livenessProbe:
            httpGet: { path: /healthz, port: mcp }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '2', memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: guanyin-mcp-gateway
  namespace: guanyin-enterprise-system
spec:
  selector: { app: guanyin-mcp-gateway }
  ports:
    - { name: mcp, port: 8080, targetPort: mcp }
    - { name: proxy, port: 8081, targetPort: proxy }
