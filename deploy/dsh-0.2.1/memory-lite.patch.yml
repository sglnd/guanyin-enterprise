# Space-local persistent memory. User settings can override this base row.
- insert:
    - id: memory-lite
      name: "@alanzhao/dsh-memory-lite"
      config:
        root: /data/dsh/.agent-memory
        defaultPeer: workspace
        workspacePeers:
          enabled: false
          excludeSubagents: true
        index:
          maxTokens: 800
        extraction:
          mode: incremental
          windowTurns: 50
          idleTimeoutMin: 30
          maxMessages: 20
          messageScope: [user, assistant]
          turnStoppingTrigger: false
          flushTrigger: false
          maxConcurrentRequests: 1
          llm:
            reasoningEffort: "off"
        sharing:
          enabled: false
