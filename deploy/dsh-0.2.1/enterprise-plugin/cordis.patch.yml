- insert:
    - id: guanyin-enterprise
      name: '@guanyin/dsh-enterprise'
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
    - id: guanyin-browser-playwright
      name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
      config:
        mode: launch
        headless: true
        executablePath: /usr/bin/chromium

# rc3 adds plugin browsing/creation menus. Keep enterprise composition fixed.
- id: entry-customization
  disabled: true
# Pin plugin binaries to the image; skill contents remain managed in-space.
- id: skills-manager
  config:
    onlineUpdate: false
